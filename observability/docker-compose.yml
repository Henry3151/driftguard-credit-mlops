# Stack OPCIONAL de observabilidade (ADR-0001):  docker compose --profile observability up -d
# Depois rode o pipeline com DRIFTGUARD_PUSHGATEWAY_URL=http://localhost:9091 para enviar as métricas.
services:
  pushgateway:
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    ports: ["9091:9091"]

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [pushgateway]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
